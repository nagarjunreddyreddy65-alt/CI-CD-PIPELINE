version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: autonomous_devops_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devops_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devops_secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-autonomous_devops_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-devops_user} -d ${POSTGRES_DB:-autonomous_devops_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autonomous_devops_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-devops_user}:${POSTGRES_PASSWORD:-devops_secure_password_2026}@db:5432/${POSTGRES_DB:-autonomous_devops_db}
      - USE_SQLITE_FALLBACK=${USE_SQLITE_FALLBACK:-False}
      - SECRET_KEY=${SECRET_KEY:-autonomous_devops_docker_secret_key_2026}
      - RUNNER_API_KEY=${RUNNER_API_KEY:-autonomous_devops_runner_dev_api_key_2026}
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  demo:
    build:
      context: .
      dockerfile: Dockerfile.demo
    container_name: autonomous_devops_demo
    depends_on:
      backend:
        condition: service_healthy
      db:
        condition: service_healthy
    environment:
      - BACKEND_URL=http://backend:8000
      - RUNNER_API_KEY=${RUNNER_API_KEY:-autonomous_devops_runner_dev_api_key_2026}
    profiles:
      - demo
    networks:
      - default

volumes:
  postgres_data:
