version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: autonomous_devops_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: devops_user
      POSTGRES_PASSWORD: devops_secure_password_2026
      POSTGRES_DB: autonomous_devops_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devops_user -d autonomous_devops_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autonomous_devops_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql+psycopg2://devops_user:devops_secure_password_2026@db:5432/autonomous_devops_db
      - USE_SQLITE_FALLBACK=False
      - SECRET_KEY=autonomous_devops_docker_secret_key_2026
      - RUNNER_API_KEY=autonomous_devops_runner_dev_api_key_2026
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
