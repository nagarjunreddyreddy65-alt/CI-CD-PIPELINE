name: CI Pipeline

on:
  push:
    branches: [ main, final-audit-remediation ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Full CI/CD Quality, Security & Test Suite
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: devops_user
          POSTGRES_PASSWORD: devops_password_test_2026
          POSTGRES_DB: autonomous_devops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff bandit pip-audit

      - name: Code Quality & Linting (Ruff Check)
        run: |
          ruff check .

      - name: Code Formatting Verification (Ruff Format)
        run: |
          ruff format --check .

      - name: Execute Full Test Suite (Pytest with Coverage)
        env:
          DATABASE_URL: postgresql://devops_user:devops_password_test_2026@localhost:5432/autonomous_devops_test
        run: |
          python -m pytest tests/ tests_sample_app/ -v --cov=app --cov=sample_app --cov-report=term-missing

      - name: Run Baseline Telemetry & Benchmark
        env:
          DATABASE_URL: postgresql://devops_user:devops_password_test_2026@localhost:5432/autonomous_devops_test
        run: |
          python scripts/benchmark_baseline.py

      - name: Run End-to-End Optimization Benchmark
        env:
          DATABASE_URL: postgresql://devops_user:devops_password_test_2026@localhost:5432/autonomous_devops_test
        run: |
          python scripts/benchmark_e2e.py

      - name: Verify Live CI Optimization Runner Integration (Full Suite, Optimized & Fallbacks)
        env:
          OPTIMIZATION_API_URL: http://127.0.0.1:8000
          RUNNER_API_KEY: autonomous_devops_runner_dev_api_key_2026
          DATABASE_URL: postgresql://devops_user:devops_password_test_2026@localhost:5432/autonomous_devops_test
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          BACKEND_PID=$!
          sleep 4
          echo "=== 1. Live Integration Test: Full Suite Fallback Override ==="
          python scripts/run_optimized_ci.py --api-url http://127.0.0.1:8000 --force-full
          echo "=== 2. Live Integration Test: Optimized Mode (Safe Change) ==="
          python scripts/run_optimized_ci.py --api-url http://127.0.0.1:8000 --changed-files sample_app/utils/math_ops.py:MODIFIED:3:1
          echo "=== 3. Live Integration Test: Safety Fallback Mode (Sensitive File) ==="
          python scripts/run_optimized_ci.py --api-url http://127.0.0.1:8000 --changed-files sample_app/auth/security_service.py:MODIFIED:2:0
          kill $BACKEND_PID || true
          echo "=== 4. Live Integration Test: API-Unavailable Fallback (Rule 19) ==="
          python scripts/run_optimized_ci.py --api-url http://127.0.0.1:9999 --changed-files sample_app/utils/math_ops.py:MODIFIED:3:1

      - name: Static Security Analysis (Bandit SAST)
        run: |
          bandit -r app sample_app -ll -ii

      - name: Dependency Vulnerability Audit (pip-audit SCA)
        run: |
          pip-audit -r requirements.txt --desc on

      - name: Secret Leak Detection (Gitleaks)
        if: matrix.python-version == '3.11'
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
