name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Baseline Test Suite Execution
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff bandit pip-audit

      - name: Code Quality & Linting (Ruff)
        run: |
          ruff check .

      - name: Execute Full Test Suite (Baseline)
        run: |
          python -m pytest tests/ tests_sample_app/ -v --cov=app --cov=sample_app --cov-report=term-missing

      - name: Run Baseline Telemetry & Benchmark
        run: |
          python scripts/benchmark_baseline.py

      - name: Security Vulnerability Scan (Bandit)
        run: |
          bandit -r app sample_app -ll -ii

      - name: Dependency Vulnerability Audit (pip-audit)
        run: |
          pip-audit --desc on || true
