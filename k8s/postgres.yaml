apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  labels:
    app: autonomous-devops
    component: database
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: autonomous-devops-postgres
  labels:
    app: autonomous-devops
    component: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: autonomous-devops
      component: database
  template:
    metadata:
      labels:
        app: autonomous-devops
        component: database
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "devops_user"
            - name: POSTGRES_PASSWORD
              value: "devops_secure_password_2026"
            - name: POSTGRES_DB
              value: "autonomous_devops_db"
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: postgres-storage
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "devops_user", "-d", "autonomous_devops_db"]
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: autonomous-devops-db
  labels:
    app: autonomous-devops
    component: database
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: autonomous-devops
    component: database
