apiVersion: v1
kind: Secret
metadata:
  name: autonomous-devops-secrets
  labels:
    app: autonomous-devops
type: Opaque
stringData:
  database-url: "postgresql://devops_user:REPLACE_WITH_SECURE_PASSWORD@autonomous-devops-db:5432/autonomous_devops_db"
  secret-key: "REPLACE_WITH_STRONG_RANDOM_SECRET_KEY_MIN_32_BYTES"
  runner-api-key: "REPLACE_WITH_SECURE_RUNNER_API_KEY_2026"
  postgres-user: "devops_user"
  postgres-password: "REPLACE_WITH_SECURE_PASSWORD"
  postgres-db: "autonomous_devops_db"
