apiVersion: apps/v1
kind: Deployment
metadata:
  name: autonomous-devops-backend
  labels:
    app: autonomous-devops
    component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: autonomous-devops
      component: backend
  template:
    metadata:
      labels:
        app: autonomous-devops
        component: backend
    spec:
      containers:
        - name: backend
          image: autonomous-devops-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: autonomous-devops-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: autonomous-devops-secrets
                  key: database-url
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: autonomous-devops-secrets
                  key: secret-key
            - name: RUNNER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: autonomous-devops-secrets
                  key: runner-api-key
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
